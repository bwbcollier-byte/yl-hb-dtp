name: Nightly Database Cleanup

on:
  # Schedule disabled 2026-05-20 — migrated to pg_cron (cron.schedule job_id 247, `hb_cleanup.nightly()`).
  # See Work/Engineering Ops/pg-cron-dtp-migration-draft.md and decisions.md 2026-05-20 architecture entry.
  # workflow_dispatch retained as belt-and-braces manual fallback.
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Notify Supabase — start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_workflow_id": 243099896, "p_status": "running", "p_run_id": "${{ github.run_id }}"  }'
      - name: Checkout Code
        uses: actions/checkout@v4

      # Note: This is a placeholder for running SQL via Supabase CLI or psql
      # You would need to set up SUPABASE_DB_URL secret
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test Connection
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Testing connection to Supabase..."
          if ! psql "$DATABASE_URL" -c "SELECT 1;" ; then
            echo "❌ Connection failed!"
            echo "If you see 'Network is unreachable', it is likely an IPv6 issue."
            echo "FIX: In Supabase, go to Settings -> Database -> Connection String -> URI."
            echo "Ensure 'Mode' is set to 'Session' (Port 5432) and use THAT string."
            exit 1
          fi
          echo "✅ Connection Success!"

      - name: Run Periodic Cleanup Scripts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🏗️ Applying Migrations..."
          psql "$DATABASE_URL" -f sql/migrations/09-hb-rank-indexes.sql

          echo "🧹 Running Deduplication..."
          psql "$DATABASE_URL" -c "SET statement_timeout = '30min';" -f sql/cleanup/02-social-dedup.sql

          echo "🔗 Running Backlink Repair..."
          psql "$DATABASE_URL" -c "SET statement_timeout = '30min';" -f sql/cleanup/05-backlink-repair.sql

          echo "⭐ Running Social Rank Update..."
          psql "$DATABASE_URL" -c "SET statement_timeout = '30min';" -f sql/cleanup/07-social-rank.sql

          echo "🏆 Running HB Rank Calculation..."
          psql "$DATABASE_URL" -c "SET statement_timeout = '30min';" -f sql/cleanup/10-hb-rank-calc.sql

          echo "📱 Running Major Socials Migration (Instagram, YT, TikTok)..."
          psql "$DATABASE_URL" -c "SET statement_timeout = '30min';" -f sql/cleanup/11-major-socials-migration.sql

      - name: Refresh Dashboard Stats
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📊 Recalculating Dashboard KPIs in the background..."
          psql "$DATABASE_URL" -c "SELECT cron.schedule('manual-dashboard-refresh', '* * * * *', \$\$ SELECT refresh_dashboard_stats(); SELECT cron.unschedule('manual-dashboard-refresh'); \$\$);"
          echo "✅ Dashboard Stats Refresh Queued!"
      - name: Notify Supabase — result
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DURATION=$(( $(date +%s) - START_TIME ))
          STATUS="${{ job.status }}"
          PAYLOAD=$(printf '{"p_workflow_id": 243099896, "p_status": "%s", "p_duration_secs": %s, "p_run_id": "${{ github.run_id }}"}' "$STATUS" "$DURATION")
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
